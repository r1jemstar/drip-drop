      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
      .drip { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; fill: #F2F2ED; }
      .drop { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; fill: #E8FF4A; }
